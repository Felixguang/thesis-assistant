name: 构建 Windows / macOS 可执行程序

on:
  push:
    branches: [main]
  workflow_dispatch:    # 允许手动触发

jobs:
  build:
    name: 打包 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 安装并打包（macOS）
        if: matrix.os == 'macos-latest'
        run: |
          set -e
          python3 -m pip install --upgrade pip
          python3 -m pip install --no-cache-dir -r requirements.txt
          # 验证 pyinstaller 真的装上了
          which pyinstaller || python3 -m PyInstaller --version
          pyinstaller --onefile --windowed --name "商务英语毕业论文助手" \
            --add-data "data/topics.json:data" \
            --collect-submodules=docx \
            --collect-submodules=openpyxl \
            --collect-submodules=xlrd \
            --hidden-import=openpyxl.styles \
            app.py

      - name: 安装并打包（Windows）
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt
          # 验证 pyinstaller 真的装上了
          pyinstaller --version
          pyinstaller --onefile --windowed --name "商务英语毕业论文助手" `
            --add-data "data/topics.json;data" `
            --collect-submodules=docx `
            --collect-submodules=openpyxl `
            --collect-submodules=xlrd `
            --hidden-import=openpyxl.styles `
            app.py

      - name: 压缩产物（macOS）
        if: matrix.os == 'macos-latest'
        run: |
          cd dist
          zip -r 商务英语毕业论文助手-macOS.zip 商务英语毕业论文助手.app

      - name: 压缩产物（Windows）
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cd dist
          Compress-Archive -Path "商务英语毕业论文助手.exe" `
            -DestinationPath "商务英语毕业论文助手-Windows.zip"

      - name: 上传产物
        uses: actions/upload-artifact@v5
        with:
          name: 商务英语毕业论文助手-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.app/
          if-no-files-found: warn